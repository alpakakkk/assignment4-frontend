<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 4 - Forms and Validation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5">
    <h1 class="mb-4">Forms and Validation</h1>

    <section class="mb-5">
      <h2>Task 0: Simple Contact Form</h2>
      <form>
        <label for="name0">Name</label>
        <input id="name0" name="name" type="text"><br>
        <label for="email0">Email</label>
        <input id="email0" name="email" type="email"><br>
        <label for="message0">Message</label><br>
        <textarea id="message0" name="message"></textarea><br>
        <button type="submit">Submit</button>
      </form>
    </section>

    <section class="mb-5">
      <h2>Task 1: HTML5 Validation</h2>
      <form>
        <label for="name1">Name</label>
        <input id="name1" name="name" type="text" maxlength="50" required><br>
        <label for="email1">Email</label>
        <input id="email1" name="email" type="email" required><br>
        <label for="message1">Message</label><br>
        <textarea id="message1" name="message" maxlength="500" required></textarea><br>
        <button type="submit">Submit</button>
      </form>
    </section>

    <section class="mb-5">
      <h2>Task 2: Bootstrap Contact Form</h2>
      <form class="row g-3">
        <div class="col-md-6">
          <label for="name2" class="form-label">Name</label>
          <input id="name2" name="name" class="form-control" type="text" placeholder="Enter your name" required>
        </div>

        <div class="col-md-6">
          <label for="email2" class="form-label">Email</label>
          <input id="email2" name="email" class="form-control" type="email" placeholder="name@example.com" required>
          <div class="form-text">We will use your email to contact you.</div>
        </div>

        <div class="col-12">
          <label for="message2" class="form-label">Message</label>
          <textarea id="message2" name="message" class="form-control" rows="3" placeholder="Write your message" required></textarea>
        </div>

        <div class="col-12">
          <button class="btn btn-primary" type="submit">Submit</button>
        </div>
      </form>
    </section>

    <section class="mb-5">
      <h2>Task 3: Bootstrap Validation</h2>
      <form class="row g-3 needs-validation" novalidate>
        <div class="col-md-6">
          <label for="name3" class="form-label">Name</label>
          <input id="name3" name="name" class="form-control" type="text" required>
          <div class="valid-feedback">Looks good!</div>
          <div class="invalid-feedback">Name is required.</div>
        </div>

        <div class="col-md-6">
          <label for="email3" class="form-label">Email</label>
          <input id="email3" name="email" class="form-control" type="email" required>
          <div class="valid-feedback">Looks good!</div>
          <div class="invalid-feedback">Enter a valid email.</div>
        </div>

        <div class="col-12">
          <label for="message3" class="form-label">Message</label>
          <textarea id="message3" name="message" class="form-control" required></textarea>
          <div class="valid-feedback">Looks good!</div>
          <div class="invalid-feedback">Message is required.</div>
        </div>

        <div class="col-12">
          <button class="btn btn-primary" type="submit">Submit</button>
        </div>
      </form>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
